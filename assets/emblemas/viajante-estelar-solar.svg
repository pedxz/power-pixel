<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Viajante Estelar — Solar">
  <defs>
    <linearGradient id="vssolar-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f4a" stop-opacity=".92"/>
      <stop offset="1" stop-color="#141826" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="vssolar-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="vssolar-glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vssolar-planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="vssolar-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#ffc26b"/>
    </linearGradient>
    <linearGradient id="vssolar-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vssolar-front"><rect x="0" y="33" width="64" height="31"/></clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#vssolar-tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#vssolar-glow)"/>
  <path d="M20 2h24a18 18 0 0 1 18 18v6H2v-6A18 18 0 0 1 20 2z" fill="url(#vssolar-shine)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="url(#vssolar-edge)"/>

  <g fill="#fff">
    <circle cx="14" cy="16" r="1.1" opacity=".85"/>
    <circle cx="50" cy="13" r=".9" opacity=".7"/>
    <circle cx="52" cy="47" r="1" opacity=".75"/>
    <circle cx="11" cy="44" r=".8" opacity=".6"/>
    <path d="M47 21l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" opacity=".95"/>
  </g>

  <ellipse cx="32" cy="34" rx="20" ry="6.2" fill="none" stroke="url(#vssolar-ring)" stroke-width="2.6" transform="rotate(-18 32 34)" opacity=".9"/>
  <circle cx="32" cy="33" r="11.5" fill="url(#vssolar-planet)"/>
  <path d="M24.5 27.5a10 10 0 0 1 8-4.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="32" cy="34" rx="20" ry="6.2" fill="none" stroke="url(#vssolar-ring)" stroke-width="2.6" transform="rotate(-18 32 34)" clip-path="url(#vssolar-front)"/>

  <path d="M16 52l9-6" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
  <circle cx="25.4" cy="45.7" r="1.3" fill="#fff"/>
